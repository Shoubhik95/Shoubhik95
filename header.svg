<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300">

  <defs>

    <!-- Background Gradient -->
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0D1117"/>
    </linearGradient>

    <!-- Name Gradient -->
    <linearGradient id="nameGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="50%" stop-color="#FF13F0"/>
      <stop offset="100%" stop-color="#A855F7"/>

      <animate attributeName="x1"
        values="0%;100%;0%"
        dur="5s"
        repeatCount="indefinite"/>

      <animate attributeName="x2"
        values="100%;0%;100%"
        dur="5s"
        repeatCount="indefinite"/>
    </linearGradient>

    <!-- Soft Glow -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Strong Glow -->
    <filter id="strongGlow">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

  </defs>

  <!-- Background -->
  <rect width="880" height="300" fill="url(#bgGlow)"/>

  <!-- HUD Corner Lines -->
  <g opacity="0.4">

    <rect x="50" y="35" width="180" height="3" fill="#00E5FF"/>
    <rect x="650" y="35" width="180" height="3" fill="#FF13F0"/>

    <rect x="50" y="260" width="180" height="3" fill="#A855F7"/>
    <rect x="650" y="260" width="180" height="3" fill="#00E5FF"/>

  </g>

  <!-- Floating Particles -->

  <circle cx="120" cy="70" r="6" fill="#00E5FF">
    <animate attributeName="cy"
      values="70;55;70"
      dur="4s"
      repeatCount="indefinite"/>
  </circle>

  <circle cx="760" cy="90" r="5" fill="#FF13F0">
    <animate attributeName="cy"
      values="90;105;90"
      dur="5s"
      repeatCount="indefinite"/>
  </circle>

  <circle cx="220" cy="220" r="5" fill="#A855F7">
    <animate attributeName="cy"
      values="220;205;220"
      dur="6s"
      repeatCount="indefinite"/>
  </circle>

  <circle cx="660" cy="210" r="6" fill="#00E5FF">
    <animate attributeName="cy"
      values="210;195;210"
      dur="4.5s"
      repeatCount="indefinite"/>
  </circle>

  <!-- Decorative Wave -->

  <path
    d="M0 230 C120 180, 220 280, 340 230 S560 180, 680 230 S800 280, 880 220"
    fill="none"
    stroke="#00E5FF"
    stroke-width="2"
    stroke-dasharray="8 10"
    opacity="0.3">

    <animate attributeName="stroke-dashoffset"
      values="0;100"
      dur="8s"
      repeatCount="indefinite"/>

  </path>

  <!-- Glow Layer -->

  <text
    x="440"
    y="105"
    text-anchor="middle"
    font-family="Orbitron, Arial, sans-serif"
    font-size="64"
    font-weight="900"
    fill="#00E5FF"
    opacity="0.25"
    filter="url(#strongGlow)">
    SHOUBHIK
  </text>

  <!-- Main Name -->

  <text
    x="440"
    y="105"
    text-anchor="middle"
    font-family="Orbitron, Arial, sans-serif"
    font-size="64"
    font-weight="900"
    fill="url(#nameGlow)">
    SHOUBHIK
  </text>

  <!-- Subtitle -->

  <text
    x="440"
    y="140"
    text-anchor="middle"
    font-family="Rajdhani, Arial, sans-serif"
    font-size="20"
    letter-spacing="6"
    fill="#FFFFFF">
    BHATTACHARYA
  </text>

  <!-- Role -->

  <text
    x="440"
    y="180"
    text-anchor="middle"
    font-family="Orbitron, Arial, sans-serif"
    font-size="18"
    fill="#FACC15">
    ⚔ GAME ARTIST • TECHNICAL ARTIST ⚔
  </text>

  <!-- Skills -->

  <text
    x="440"
    y="210"
    text-anchor="middle"
    font-family="Rajdhani, Arial, sans-serif"
    font-size="14"
    fill="#9CA3AF">
    REAL-TIME RENDERING • SHADERS • VFX • PLAYABLE WORLDS
  </text>

  <!-- Loading Bar -->

  <rect
    x="280"
    y="240"
    width="320"
    height="20"
    rx="10"
    fill="#111827"
    stroke="#00E5FF"
    stroke-width="1.5"/>

  <rect
    x="280"
    y="240"
    width="180"
    height="20"
    rx="10"
    fill="#00E5FF">

    <animate
      attributeName="width"
      values="60;250;140;220;180"
      dur="5s"
      repeatCount="indefinite"/>

  </rect>

  <text
    x="440"
    y="254"
    text-anchor="middle"
    font-family="Orbitron, Arial, sans-serif"
    font-size="10"
    fill="#FFFFFF">
    LOADING CHARACTER SHEET...
  </text>

</svg>
