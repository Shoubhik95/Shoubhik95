<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300">
<defs>
<pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse">
<path d="M25 0 L0 0 0 25"
fill="none"
stroke="#00E5FF"
stroke-opacity="0.08"
stroke-width="1"/>
</pattern>
</defs>
<rect width="880" height="300" fill="#0D1117"/>
<rect width="880" height="300" fill="url(#grid)"/>
<!-- Status Panel -->
<rect x="25" y="75" width="180" height="120" rx="12"
fill="#0F172A" stroke="#00E5FF" stroke-width="1.5"/>
<!-- Loadout Panel -->
<rect x="675" y="75" width="180" height="120" rx="12"
fill="#0F172A" stroke="#FF13F0" stroke-width="1.5"/>
<!-- Main Name -->
<text x="440" y="105" text-anchor="middle"
font-size="64" font-weight="900"
fill="#00E5FF">
SHOUBHIK
</text>
<text x="440" y="140" text-anchor="middle"
font-size="20" fill="#FFFFFF">
BHATTACHARYA
</text>
<!-- Scanner -->
<rect x="0" y="0" width="880" height="2"
fill="#00E5FF" opacity="0.6">
<animate attributeName="y"
values="0;300;0"
dur="4s"
repeatCount="indefinite"/>
</rect>
</svg>
