<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="220" height="220" viewBox="0 0 220 220">
  <defs>
    <linearGradient id="frameGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00E5FF">
        <animate attributeName="stop-color" values="#00E5FF;#00FFFF;#00E5FF" dur="2s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#FACC15">
        <animate attributeName="stop-color" values="#FACC15;#00E5FF;#FACC15" dur="2s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <filter id="avatarGlow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .pulse { animation: pulse 1.5s ease-in-out infinite; }
      @keyframes pulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(0.95); opacity: 0.8; } }
    </style>
  </defs>
  <rect width="220" height="220" fill="#0D1117" rx="15"/>
  <rect x="10" y="10" width="200" height="200" fill="none" stroke="url(#frameGlow)"
        stroke-width="4" rx="10" filter="url(#avatarGlow)" class="pulse"/>
  <rect x="25" y="25" width="170" height="170" fill="#161B22" rx="8"/>
  <circle cx="110" cy="90" r="35" fill="#00E5FF" opacity="0.8"/>
  <rect x="85" y="135" width="50" height="50" fill="#00E5FF" opacity="0.6" rx="10"/>
  <rect x="30" y="30" width="20" height="5" fill="#FACC15"/>
  <rect x="170" y="30" width="20" height="5" fill="#FACC15"/>
  <rect x="30" y="185" width="20" height="5" fill="#FACC15"/>
  <rect x="170" y="185" width="20" height="5" fill="#FACC15"/>
  <text x="110" y="205" font-family="monospace" font-size="12" fill="#00E5FF" text-anchor="middle">
    SHOUBHIK_BHATTACHARYA.exe
  </text>
</svg>
