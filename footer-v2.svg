<svg viewBox="0 0 950 180" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#03050a"/>
      <stop offset="50%" stop-color="#070a13"/>
      <stop offset="100%" stop-color="#0a0f1d"/>
    </linearGradient>

    <!-- Neon Accents -->
    <linearGradient id="neonAcc" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF4FD8"/>
      <stop offset="50%" stop-color="#9B5CFF"/>
      <stop offset="100%" stop-color="#00E5FF"/>
    </linearGradient>

    <!-- Tech Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#9B5CFF" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="950" height="180" fill="url(#bgGrad)"/>
  <rect width="950" height="180" fill="url(#grid)"/>

  <!-- Top Border line -->
  <line x1="20" y1="10" x2="930" y2="10" stroke="#9B5CFF" stroke-opacity="0.2" stroke-width="1"/>

  <!-- Left HUD Element (Module Connection) -->
  <g transform="translate(40, 45)">
    <rect width="250" height="90" rx="8" fill="#04060b" stroke="#FF4FD8" stroke-opacity="0.25" stroke-width="1"/>
    <text x="15" y="25" font-family="'Courier New', monospace" font-size="10" fill="#FF4FD8" font-weight="bold">MODULE: CORE_SHIELD</text>
    <text x="15" y="45" font-family="system-ui, sans-serif" font-weight="800" font-size="14" fill="#ffffff">SYSTEM CONNECTED</text>
    <text x="15" y="70" font-family="'Courier New', monospace" font-size="11" fill="#8c9fc2">STATUS: STABLE // PING: 12ms</text>
    
    <!-- Connection Dots -->
    <circle cx="215" cy="45" r="6" fill="#00E5FF"/>
    <circle cx="215" cy="45" r="10" fill="none" stroke="#00E5FF" stroke-opacity="0.5">
      <animate attributeName="r" values="6;16;6" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Center Text (NEW GAME + / Call To Action) -->
  <g transform="translate(320, 45)">
    <text x="155" y="28" font-family="system-ui, sans-serif" font-weight="900" font-size="26" fill="url(#neonAcc)" letter-spacing="2" text-anchor="middle">NEW GAME +</text>
    <text x="155" y="52" font-family="'Courier New', monospace" font-weight="bold" font-size="12" fill="#ffffff" letter-spacing="1" text-anchor="middle">LET'S BUILD SOMETHING LEGENDARY</text>
    <text x="155" y="75" font-family="system-ui, sans-serif" font-size="11" fill="#8c9fc2" text-anchor="middle">Reach out to start a quest: shoubhikbhattacharya06@gmail.com</text>
  </g>

  <!-- Right HUD Element (Project Analytics) -->
  <g transform="translate(660, 45)">
    <rect width="250" height="90" rx="8" fill="#04060b" stroke="#00E5FF" stroke-opacity="0.25" stroke-width="1"/>
    <text x="15" y="25" font-family="'Courier New', monospace" font-size="10" fill="#00E5FF" font-weight="bold">MODULE: BUILD_LOGGER</text>
    <text x="15" y="45" font-family="system-ui, sans-serif" font-weight="800" font-size="14" fill="#ffffff">5 DEPLOYED BUILDS</text>
    <text x="15" y="70" font-family="'Courier New', monospace" font-size="11" fill="#8c9fc2">4 SMALL // 1 ACTIVE BIG</text>
  </g>

  <!-- Footer Bottom bar -->
  <g transform="translate(20, 155)">
    <text x="0" y="10" font-family="'Courier New', monospace" font-size="10" fill="#8c9fc2">© 2026 SHOUBHIK BHATTACHARYA</text>
    <text x="910" y="10" font-family="'Courier New', monospace" font-size="10" fill="#8c9fc2" text-anchor="end">SYS_VERSION: 3.4.1</text>
  </g>

  <!-- Frame Corners -->
  <path d="M 12 20 L 12 12 L 20 12" stroke="#9B5CFF" stroke-width="2" fill="none"/>
  <path d="M 938 20 L 938 12 L 930 12" stroke="#9B5CFF" stroke-width="2" fill="none"/>
  <path d="M 12 160 L 12 168 L 20 168" stroke="#9B5CFF" stroke-width="2" fill="none"/>
  <path d="M 938 160 L 938 168 L 930 168" stroke="#9B5CFF" stroke-width="2" fill="none"/>
</svg>
