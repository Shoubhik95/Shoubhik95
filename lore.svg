<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="260" height="260" viewBox="0 0 260 260">
  <defs>
    <style>
      .flow { animation: flow 3s linear infinite; }
      @keyframes flow { 0% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: -100; } }
      .blink { animation: blink 1s ease-in-out infinite; }
      @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    </style>
  </defs>
  <rect width="260" height="260" fill="#0D1117" rx="10"/>
  <path d="M 30 50 L 80 50 L 80 100" stroke="#00E5FF" stroke-width="2" fill="none" stroke-dasharray="5,5" class="flow"/>
  <path d="M 180 50 L 230 50 L 230 100" stroke="#FACC15" stroke-width="2" fill="none" stroke-dasharray="5,5" class="flow"/>
  <path d="M 30 210 L 80 210 L 80 160" stroke="#00E5FF" stroke-width="2" fill="none" stroke-dasharray="5,5" class="flow"/>
  <path d="M 180 210 L 230 210 L 230 160" stroke="#FACC15" stroke-width="2" fill="none" stroke-dasharray="5,5" class="flow"/>
  <circle cx="130" cy="130" r="40" fill="#161B22" stroke="#00E5FF" stroke-width="3"/>
  <circle cx="130" cy="130" r="15" fill="#00E5FF" class="blink"/>
  <circle cx="80" cy="50" r="5" fill="#FACC15" class="blink"/>
  <circle cx="230" cy="50" r="5" fill="#FACC15" class="blink"/>
  <circle cx="80" cy="210" r="5" fill="#00E5FF" class="blink"/>
  <circle cx="230" cy="210" r="5" fill="#00E5FF" class="blink"/>
  <text x="130" y="125" font-family="monospace" font-size="20" fill="#00E5FF" text-anchor="middle">🎨</text>
  <text x="130" y="150" font-family="monospace" font-size="20" fill="#FACC15" text-anchor="middle">⚙️</text>
</svg>
