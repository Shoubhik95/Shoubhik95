<svg viewBox="0 0 250 250" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .mc-font-bold { font-family: 'Courier New', Courier, monospace; font-weight: 900; }
      .pixel-text { font-family: 'Courier New', Courier, monospace; image-rendering: pixelated; }
    </style>

    <!-- Dirt/Stone Pixel Pattern -->
    <pattern id="mcDirt" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="#1e140d"/>
      <rect x="0" y="0" width="10" height="10" fill="#2d1e13"/>
      <rect x="20" y="10" width="10" height="10" fill="#2d1e13"/>
      <rect x="10" y="20" width="10" height="10" fill="#2d1e13"/>
      <rect x="30" y="30" width="10" height="10" fill="#2d1e13"/>
      <rect x="10" y="0" width="10" height="10" fill="#120c08"/>
      <rect x="30" y="10" width="10" height="10" fill="#120c08"/>
      <rect x="0" y="20" width="10" height="10" fill="#120c08"/>
      <rect x="20" y="30" width="10" height="10" fill="#120c08"/>
    </pattern>

    <filter id="mcShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="2" stdDeviation="0" flood-color="#3f3f3f" flood-opacity="1"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="250" height="250" rx="12" fill="url(#mcDirt)" stroke="#4a3b32" stroke-width="6"/>
  <rect x="6" y="6" width="238" height="238" fill="none" stroke="#000000" stroke-opacity="0.4" stroke-width="3" rx="8"/>

  <!-- Pixelated Block in the center -->
  <g transform="translate(65, 55)">
    <!-- Base block face -->
    <rect width="120" height="120" fill="#737373" stroke="#000000" stroke-width="4"/>
    
    <!-- Diamond veins on the block -->
    <rect x="12" y="12" width="20" height="20" fill="#55ffff"/>
    <rect x="16" y="16" width="12" height="12" fill="#ffffff"/>
    
    <rect x="88" y="12" width="20" height="20" fill="#55ffff"/>
    <rect x="92" y="16" width="12" height="12" fill="#ffffff"/>

    <rect x="12" y="88" width="20" height="20" fill="#55ffff"/>
    <rect x="16" y="92" width="12" height="12" fill="#ffffff"/>

    <rect x="88" y="88" width="20" height="20" fill="#55ffff"/>
    <rect x="92" y="92" width="12" height="12" fill="#ffffff"/>

    <!-- Central letters "SB" in pixel text -->
    <text x="60" y="72" class="mc-font-bold pixel-text" font-size="34" fill="#FFFF55" text-anchor="middle" filter="url(#mcShadow)">SB</text>
  </g>

  <!-- Status Text -->
  <text x="125" y="215" class="pixel-text" font-size="10" fill="#55FF55" text-anchor="middle" filter="url(#mcShadow)">[TA_CORE ACTIVE]</text>
</svg>
