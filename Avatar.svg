<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="aPortalBg" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#1B0F3D"/>
      <stop offset="100%" stop-color="#050308"/>
    </radialGradient>
    <radialGradient id="aCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#2DE2E6"/>
      <stop offset="100%" stop-color="#2DE2E6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="aRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2DE2E6"/>
      <stop offset="100%" stop-color="#9B5CFF"/>
    </linearGradient>
    <pattern id="aHex" width="22" height="19" patternUnits="userSpaceOnUse">
      <path d="M11 0 L22 5.6 L22 14 L11 19 L0 14 L0 5.6 Z" fill="none" stroke="#2DE2E6" stroke-opacity="0.08"/>
    </pattern>
    <clipPath id="aClip"><circle cx="120" cy="118" r="66"/></clipPath>
    <filter id="aGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="240" height="240" rx="14" fill="#06060F"/>
  <rect width="240" height="240" rx="14" fill="url(#aHex)"/>

  <g stroke="#2DE2E6" stroke-width="1.6" fill="none" stroke-linecap="round">
    <path d="M14,28 L14,14 L28,14"/>
    <path d="M212,14 L226,14 L226,28"/>
    <path d="M14,212 L14,226 L28,226"/>
    <path d="M226,212 L226,226 L212,226"/>
  </g>

  <g>
    <circle cx="120" cy="118" r="92" fill="none" stroke="#FF4FD8" stroke-opacity="0.35" stroke-dasharray="2 9"/>
    <animateTransform attributeName="transform" type="rotate" from="0 120 118" to="360 120 118" dur="30s" repeatCount="indefinite"/>
  </g>
  <g stroke="#2DE2E6" stroke-width="1.3" opacity="0.7">
    <line x1="120" y1="14" x2="120" y2="26"/>
    <line x1="120" y1="210" x2="120" y2="222"/>
    <line x1="16" y1="118" x2="28" y2="118"/>
    <line x1="212" y1="118" x2="224" y2="118"/>
  </g>

  <circle cx="120" cy="118" r="66" fill="url(#aPortalBg)" stroke="url(#aRing)" stroke-width="2.5"/>

  <g clip-path="url(#aClip)">
    <line x1="58" y1="104" x2="182" y2="104" stroke="#2DE2E6" stroke-opacity="0.4"/>
    <g stroke="#2DE2E6" stroke-opacity="0.28">
      <line x1="120" y1="104" x2="64" y2="186"/>
      <line x1="120" y1="104" x2="92" y2="186"/>
      <line x1="120" y1="104" x2="120" y2="186"/>
      <line x1="120" y1="104" x2="148" y2="186"/>
      <line x1="120" y1="104" x2="176" y2="186"/>
    </g>
    <rect x="58" width="124" height="2.4" fill="#2DE2E6" opacity="0.3">
      <animate attributeName="y" values="50;186;50" dur="3s" repeatCount="indefinite"/>
    </rect>
  </g>

  <circle cx="120" cy="116" r="34" fill="url(#aCore)" opacity="0.6" filter="url(#aGlow)"/>
  <text x="120" y="128" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="800" font-size="30" fill="#F4FBFF" filter="url(#aGlow)">SB</text>

  <text x="120" y="232" text-anchor="middle" font-family="'Courier New',Consolas,monospace" font-size="9" letter-spacing="2.5" fill="#6B7AA1">UNIT :: ONLINE</text>
</svg>
