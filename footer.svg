<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="600" height="100" viewBox="0 0 600 100">
  <defs>
    <linearGradient id="footerText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00E5FF">
        <animate attributeName="stop-color" values="#00E5FF;#00FFFF;#00E5FF" dur="2.5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#FACC15">
        <animate attributeName="stop-color" values="#FACC15;#00E5FF;#FACC15" dur="2.5s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <style>
      .pixelJump { animation: pixelJump 1.2s ease-in-out infinite; }
      @keyframes pixelJump { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
    </style>
  </defs>
  <rect width="600" height="100" fill="#0D1117"/>
  <text x="300" y="55" font-family="monospace" font-size="24" fill="url(#footerText)" text-anchor="middle">
    THANKS FOR PLAYING
  </text>
  <rect x="250" y="70" width="8" height="8" fill="#00E5FF" class="pixelJump"/>
  <rect x="270" y="75" width="8" height="8" fill="#00E5FF" class="pixelJump"/>
  <rect x="290" y="70" width="8" height="8" fill="#FACC15" class="pixelJump"/>
  <rect x="310" y="75" width="8" height="8" fill="#00E5FF" class="pixelJump"/>
  <rect x="330" y="70" width="8" height="8" fill="#00E5FF" class="pixelJump"/>
  <rect x="350" y="75" width="8" height="8" fill="#FACC15" class="pixelJump"/>
</svg>
