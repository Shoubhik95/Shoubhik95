<svg viewBox="0 0 950 180" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .mc-font-bold { font-family: 'Courier New', Courier, monospace; font-weight: 900; }
      .mc-font-normal { font-family: 'Courier New', Courier, monospace; font-weight: bold; }
      .pixel-text { font-family: 'Courier New', Courier, monospace; image-rendering: pixelated; }
    </style>

    <!-- Dirt/Stone Pixel Pattern -->
    <pattern id="mcDirt" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="#1e140d"/>
      <rect x="0" y="0" width="10" height="10" fill="#2d1e13"/>
      <rect x="20" y="10" width="10" height="10" fill="#2d1e13"/>
      <rect x="10" y="20" width="10" height="10" fill="#2d1e13"/>
      <rect x="30" y="30" width="10" height="10" fill="#2d1e13"/>
      <rect x="10" y="0" width="10" height="10" fill="#120c08"/>
      <rect x="30" y="10" width="10" height="10" fill="#120c08"/>
      <rect x="0" y="20" width="10" height="10" fill="#120c08"/>
      <rect x="20" y="30" width="10" height="10" fill="#120c08"/>
    </pattern>

    <filter id="mcShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="2" stdDeviation="0" flood-color="#3f3f3f" flood-opacity="1"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="950" height="180" fill="url(#mcDirt)" stroke="#4a3b32" stroke-width="6"/>
  <rect x="6" y="6" width="938" height="168" fill="none" stroke="#000000" stroke-opacity="0.4" stroke-width="3"/>

  <!-- Left Graphic: Pixel Crafting Table / Block -->
  <g transform="translate(45, 30)">
    <rect width="120" height="120" fill="#573d2a" stroke="#000000" stroke-width="3"/>
    <!-- Crafting table grid representation -->
    <rect x="15" y="15" width="26" height="26" fill="#8f8f8f" stroke="#000000" stroke-width="2"/>
    <rect x="47" y="15" width="26" height="26" fill="#8f8f8f" stroke="#000000" stroke-width="2"/>
    <rect x="79" y="15" width="26" height="26" fill="#8f8f8f" stroke="#000000" stroke-width="2"/>
    
    <rect x="15" y="47" width="26" height="26" fill="#8f8f8f" stroke="#000000" stroke-width="2"/>
    <rect x="47" y="47" width="26" height="26" fill="#8f8f8f" stroke="#000000" stroke-width="2"/>
    <rect x="79" y="47" width="26" height="26" fill="#8f8f8f" stroke="#000000" stroke-width="2"/>

    <rect x="15" y="79" width="26" height="26" fill="#8f8f8f" stroke="#000000" stroke-width="2"/>
    <rect x="47" y="79" width="26" height="26" fill="#8f8f8f" stroke="#000000" stroke-width="2"/>
    <rect x="79" y="79" width="26" height="26" fill="#8f8f8f" stroke="#000000" stroke-width="2"/>

    <!-- Output Arrow -->
    <polygon points="107,63 115,63 115,69 107,69" fill="#55ff55"/>
  </g>

  <!-- Center Text (Minecraft Menu Buttons Style) -->
  <g transform="translate(195, 30)">
    <!-- Simulated Menu Button 1: Respawn -->
    <rect x="30" y="10" width="500" height="40" fill="#8f8f8f" stroke="#000000" stroke-width="3"/>
    <rect x="33" y="13" width="494" height="34" fill="#5c5c5c"/>
    <text x="280" y="34" class="mc-font-bold pixel-text" font-size="16" fill="#FFFF55" text-anchor="middle" filter="url(#mcShadow)">NEW GAME +</text>

    <!-- Simulated Menu Button 2: Main Menu -->
    <rect x="30" y="60" width="500" height="40" fill="#8f8f8f" stroke="#000000" stroke-width="3"/>
    <rect x="33" y="63" width="494" height="34" fill="#5c5c5c"/>
    <text x="280" y="84" class="mc-font-bold pixel-text" font-size="14" fill="#ffffff" text-anchor="middle" filter="url(#mcShadow)">QUEST STATUS: READY TO BUILD</text>

    <!-- Call to action email link -->
    <text x="280" y="125" class="mc-font-normal pixel-text" font-size="11" fill="#FFAA00" text-anchor="middle" filter="url(#mcShadow)">shoubhikbhattacharya06@gmail.com</text>
  </g>

  <!-- Right Graphic: Pixel Diamond Icon -->
  <g transform="translate(760, 30)">
    <!-- A 3D pixel diamond vector -->
    <path d="M40,10 L70,35 L70,55 L40,110 L10,55 L10,35 Z" fill="#55ffff" stroke="#000000" stroke-width="3"/>
    <path d="M40,20 L60,40 L60,50 L40,95 L20,50 L20,40 Z" fill="#e9ffff"/>
    <path d="M40,30 L50,45 L50,50 L40,80 L30,50 L30,45 Z" fill="#ffffff"/>
  </g>

  <!-- Footer Stats / Version -->
  <g transform="translate(20, 160)">
    <text x="10" y="0" class="mc-font-normal pixel-text" font-size="10" fill="#8c8c8c">© 2026 SHOUBHIK BHATTACHARYA</text>
    <text x="910" y="0" class="mc-font-normal pixel-text" font-size="10" fill="#8c8c8c" text-anchor="end">SYS VERSION: 1.20.4 (RELEASE)</text>
  </g>
</svg>
