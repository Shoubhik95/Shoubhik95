<svg viewBox="0 0 900 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="fBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#120B2E"/>
      <stop offset="55%" stop-color="#0B0A1F"/>
      <stop offset="100%" stop-color="#06060F"/>
    </linearGradient>
    <linearGradient id="fTitleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF4FD8"/>
      <stop offset="55%" stop-color="#9B5CFF"/>
      <stop offset="100%" stop-color="#2DE2E6"/>
    </linearGradient>
    <radialGradient id="fCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#9B5CFF"/>
      <stop offset="100%" stop-color="#9B5CFF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="fHex" width="34" height="30" patternUnits="userSpaceOnUse">
      <path d="M17 0 L34 8.6 L34 21.4 L17 30 L0 21.4 L0 8.6 Z" fill="none" stroke="#2DE2E6" stroke-opacity="0.07"/>
    </pattern>
    <filter id="fGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="900" height="260" fill="url(#fBg)"/>
  <rect width="900" height="260" fill="url(#fHex)"/>
  <rect x="6" y="6" width="888" height="248" rx="6" fill="none" stroke="#2DE2E6" stroke-opacity="0.18"/>

  <g stroke="#2DE2E6" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M18,40 L18,18 L40,18"/>
    <path d="M860,18 L882,18 L882,40"/>
    <path d="M18,220 L18,242 L40,242"/>
    <path d="M882,220 L882,242 L860,242"/>
  </g>

  <!-- closing portal, left -->
  <g transform="translate(150,128)">
    <circle r="70" fill="none" stroke="#2DE2E6" stroke-opacity="0.4" stroke-width="1.5">
      <animate attributeName="r" values="70;62;70" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle r="86" fill="none" stroke="#FF4FD8" stroke-opacity="0.3" stroke-dasharray="3 8">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="22s" repeatCount="indefinite"/>
    </circle>
    <g stroke="#9B5CFF" stroke-opacity="0.45" stroke-width="1">
      <line x1="0" y1="-58" x2="0" y2="-20"/>
      <line x1="41" y1="-41" x2="14" y2="-14"/>
      <line x1="58" y1="0" x2="20" y2="0"/>
      <line x1="41" y1="41" x2="14" y2="14"/>
      <line x1="0" y1="58" x2="0" y2="20"/>
      <line x1="-41" y1="41" x2="-14" y2="14"/>
      <line x1="-58" y1="0" x2="-20" y2="0"/>
      <line x1="-41" y1="-41" x2="-14" y2="-14"/>
    </g>
    <circle r="16" fill="url(#fCore)" filter="url(#fGlow)">
      <animate attributeName="opacity" values="0.9;0.4;0.9" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- text block -->
  <g>
    <text x="290" y="92" font-family="Arial,Helvetica,sans-serif" font-weight="800" font-size="34" fill="#7D8AB0" text-decoration="line-through">GAME OVER?</text>
    <text x="290" y="138" font-family="Arial,Helvetica,sans-serif" font-weight="800" font-size="42" letter-spacing="1" fill="url(#fTitleGrad)">NAH — NEW GAME +</text>
    <text x="290" y="168" font-family="'Courier New',Consolas,monospace" font-size="14" letter-spacing="1.5" fill="#9FB4D6">READY TO BUILD SOMETHING IMMERSIVE TOGETHER?</text>
    <rect x="290" y="182" width="64" height="3" fill="#2DE2E6"/>
  </g>

  <line x1="18" y1="206" x2="882" y2="206" stroke="#2DE2E6" stroke-opacity="0.15"/>

  <g>
    <circle cx="40" cy="226" r="4" fill="#2DE2E6"/>
    <circle cx="56" cy="226" r="4" fill="#9B5CFF"/>
    <circle cx="72" cy="226" r="4" fill="#FF4FD8"/>
    <text x="450" y="230" text-anchor="middle" font-family="'Courier New',Consolas,monospace" font-size="12" letter-spacing="3" fill="#6B7AA1">THANKS FOR PLAYING</text>
    <circle cx="828" cy="226" r="4" fill="#FF4FD8"/>
    <circle cx="844" cy="226" r="4" fill="#9B5CFF"/>
    <circle cx="860" cy="226" r="4" fill="#2DE2E6"/>
  </g>
</svg>
