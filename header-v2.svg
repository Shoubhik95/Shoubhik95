<svg viewBox="0 0 950 350" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="60%" stop-color="#070a13"/>
      <stop offset="100%" stop-color="#03050a"/>
    </linearGradient>

    <!-- Title Neon Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="50%" stop-color="#9B5CFF"/>
      <stop offset="100%" stop-color="#FF4FD8"/>
    </linearGradient>

    <!-- Tech Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#00E5FF" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>

    <!-- Dot Pattern -->
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#FF4FD8" fill-opacity="0.08"/>
    </pattern>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base Grid Background -->
  <rect width="950" height="350" fill="url(#bgGrad)"/>
  <rect width="950" height="350" fill="url(#grid)"/>
  <rect width="950" height="350" fill="url(#dots)"/>

  <!-- Left Side: Interactive Shader-Node/Viewport Graphic -->
  <g transform="translate(40, 45)">
    <!-- Viewport Box -->
    <rect width="260" height="260" rx="10" fill="#04060b" stroke="#00E5FF" stroke-opacity="0.25" stroke-width="1.5" />
    
    <!-- Coordinate Grid & Axes -->
    <line x1="130" y1="20" x2="130" y2="240" stroke="#9B5CFF" stroke-opacity="0.2" stroke-dasharray="4 4"/>
    <line x1="20" y1="130" x2="240" y2="130" stroke="#9B5CFF" stroke-opacity="0.2" stroke-dasharray="4 4"/>

    <!-- Glowing Orbiting Rings (TA / Game Design Motif) -->
    <circle cx="130" cy="130" r="80" fill="none" stroke="#FF4FD8" stroke-opacity="0.15" stroke-width="1"/>
    <circle cx="130" cy="130" r="60" fill="none" stroke="#00E5FF" stroke-opacity="0.25" stroke-width="1.5" stroke-dasharray="10 30">
      <animateTransform attributeName="transform" type="rotate" from="0 130 130" to="360 130 130" dur="15s" repeatCount="indefinite"/>
    </circle>
    
    <circle cx="130" cy="130" r="45" fill="none" stroke="#9B5CFF" stroke-opacity="0.4" stroke-width="2" stroke-dasharray="40 10">
      <animateTransform attributeName="transform" type="rotate" from="360 130 130" to="0 130 130" dur="10s" repeatCount="indefinite"/>
    </circle>

    <!-- Center Node (Light Core) -->
    <circle cx="130" cy="130" r="8" fill="#00E5FF" filter="url(#neonGlow)"/>
    <circle cx="130" cy="130" r="3" fill="#ffffff"/>

    <!-- Code Vertex points -->
    <g fill="#00E5FF">
      <circle cx="70" cy="90" r="4"><animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/></circle>
      <circle cx="190" cy="90" r="4"><animate attributeName="opacity" values="1;0.3;1" dur="2.5s" repeatCount="indefinite"/></circle>
      <circle cx="100" cy="190" r="4"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="3s" repeatCount="indefinite"/></circle>
      <circle cx="170" cy="180" r="4"><animate attributeName="opacity" values="0.8;0.2;0.8" dur="1.8s" repeatCount="indefinite"/></circle>
    </g>
    
    <!-- Node Connection Lines -->
    <path d="M 70 90 L 130 130 M 190 90 L 130 130 M 100 190 L 130 130 M 170 180 L 130 130" stroke="#00E5FF" stroke-opacity="0.3" stroke-width="1"/>

    <!-- UI Overlay texts -->
    <text x="15" y="25" font-family="'Courier New', monospace" font-size="10" fill="#00E5FF" font-weight="bold">LOD_0 // SHADER RENDER</text>
    <text x="15" y="245" font-family="'Courier New', monospace" font-size="10" fill="#FF4FD8">SYS.RENDER_OK</text>
    <text x="245" y="25" font-family="'Courier New', monospace" font-size="10" fill="#9B5CFF" text-anchor="end">FPS: 60.0</text>
  </g>

  <!-- Right Side: Text & Dashboard Data -->
  <!-- Name -->
  <text x="330" y="95" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="38" fill="url(#titleGrad)" letter-spacing="0.5">SHOUBHIK BHATTACHARYA</text>
  
  <!-- Role / Subtitle -->
  <text x="342" y="130" font-family="'Courier New', monospace" font-size="16" font-weight="bold" fill="#ffffff" letter-spacing="3">TECHNICAL ARTIST &amp; GAME DESIGNER</text>
  
  <!-- Bio line -->
  <text x="342" y="158" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#8c9fc2">3+ Years of engineering immersive game mechanics, real-time assets, &amp; pipelines.</text>

  <!-- Dashboard Stats row -->
  <g transform="translate(340, 180)">
    <!-- Stat 1 -->
    <rect width="165" height="50" rx="6" fill="#0c1328" stroke="#9B5CFF" stroke-opacity="0.3" stroke-width="1"/>
    <text x="15" y="20" font-family="'Courier New', monospace" font-size="9" fill="#9B5CFF">EXPERIENCE</text>
    <text x="15" y="40" font-family="system-ui, sans-serif" font-weight="bold" font-size="16" fill="#ffffff">3+ Years</text>

    <!-- Stat 2 -->
    <rect x="180" width="180" height="50" rx="6" fill="#0c1328" stroke="#00E5FF" stroke-opacity="0.3" stroke-width="1"/>
    <text x="195" y="20" font-family="'Courier New', monospace" font-size="9" fill="#00E5FF">ACTIVE PIPELINE</text>
    <text x="195" y="40" font-family="system-ui, sans-serif" font-weight="bold" font-size="16" fill="#ffffff">1 Big Project</text>

    <!-- Stat 3 -->
    <rect x="375" width="185" height="50" rx="6" fill="#0c1328" stroke="#FF4FD8" stroke-opacity="0.3" stroke-width="1"/>
    <text x="390" y="20" font-family="'Courier New', monospace" font-size="9" fill="#FF4FD8">COMPLETED BUILDS</text>
    <text x="390" y="40" font-family="system-ui, sans-serif" font-weight="bold" font-size="16" fill="#ffffff">4 Small Projects</text>
  </g>

  <!-- Engine Specs / Badges Graphic in Header -->
  <g transform="translate(340, 255)">
    <!-- Unreal Engine Tag -->
    <rect width="105" height="28" rx="14" fill="#18233c" stroke="#00E5FF" stroke-opacity="0.4"/>
    <circle cx="14" cy="14" r="5" fill="#00E5FF"/>
    <text x="28" y="18" font-family="'Courier New', monospace" font-size="11" font-weight="bold" fill="#ffffff">UNREAL</text>

    <!-- Unity Tag -->
    <rect x="115" width="95" height="28" rx="14" fill="#18233c" stroke="#9B5CFF" stroke-opacity="0.4"/>
    <circle cx="129" cy="14" r="5" fill="#9B5CFF"/>
    <text x="143" y="18" font-family="'Courier New', monospace" font-size="11" font-weight="bold" fill="#ffffff">UNITY</text>

    <!-- Blender Tag -->
    <rect x="220" width="105" height="28" rx="14" fill="#18233c" stroke="#FF4FD8" stroke-opacity="0.4"/>
    <circle cx="234" cy="14" r="5" fill="#FF4FD8"/>
    <text x="248" y="18" font-family="'Courier New', monospace" font-size="11" font-weight="bold" fill="#ffffff">BLENDER</text>

    <!-- Shaders Tag -->
    <rect x="335" width="105" height="28" rx="14" fill="#18233c" stroke="#00E5FF" stroke-opacity="0.4"/>
    <circle cx="349" cy="14" r="5" fill="#00E5FF"/>
    <text x="363" y="18" font-family="'Courier New', monospace" font-size="11" font-weight="bold" fill="#ffffff">PYTHON/CPP</text>

    <!-- Figma Tag -->
    <rect x="450" width="90" height="28" rx="14" fill="#18233c" stroke="#9B5CFF" stroke-opacity="0.4"/>
    <circle cx="464" cy="14" r="5" fill="#9B5CFF"/>
    <text x="478" y="18" font-family="'Courier New', monospace" font-size="11" font-weight="bold" fill="#ffffff">FIGMA</text>
  </g>

  <!-- Bottom Interactive Status Bar -->
  <g transform="translate(340, 305)">
    <!-- Loading Slider Bar -->
    <rect width="560" height="6" rx="3" fill="#0a1224" />
    <rect width="420" height="6" rx="3" fill="url(#titleGrad)" filter="url(#neonGlow)"/>
    <text x="430" y="-5" font-family="'Courier New', monospace" font-size="10" fill="#00E5FF" font-weight="bold">DEPLOYED PORTFOLIO // 80% CORE STABILITY</text>
  </g>

  <!-- Frame Corners for HUD aesthetics -->
  <path d="M 12 30 L 12 12 L 30 12" stroke="#00E5FF" stroke-width="3" fill="none"/>
  <path d="M 938 30 L 938 12 L 920 12" stroke="#00E5FF" stroke-width="3" fill="none"/>
  <path d="M 12 320 L 12 338 L 30 338" stroke="#00E5FF" stroke-width="3" fill="none"/>
  <path d="M 938 320 L 938 338 L 920 338" stroke="#00E5FF" stroke-width="3" fill="none"/>
</svg>
