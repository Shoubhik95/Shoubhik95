<svg viewBox="0 0 900 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06060F"/>
      <stop offset="55%" stop-color="#0B0A1F"/>
      <stop offset="100%" stop-color="#120B2E"/>
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2DE2E6"/>
      <stop offset="55%" stop-color="#9B5CFF"/>
      <stop offset="100%" stop-color="#FF4FD8"/>
    </linearGradient>

    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E9FFFF"/>
      <stop offset="35%" stop-color="#2DE2E6"/>
      <stop offset="100%" stop-color="#2DE2E6" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="portalBg" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#1B0F3D"/>
      <stop offset="100%" stop-color="#050308"/>
    </radialGradient>

    <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2DE2E6"/>
      <stop offset="100%" stop-color="#9B5CFF"/>
    </linearGradient>

    <pattern id="hexGrid" width="34" height="30" patternUnits="userSpaceOnUse" patternTransform="translate(0,0)">
      <path d="M17 0 L34 8.6 L34 21.4 L17 30 L0 21.4 L0 8.6 Z" fill="none" stroke="#2DE2E6" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>

    <pattern id="scan" width="3" height="3" patternUnits="userSpaceOnUse">
      <rect width="3" height="1" fill="#FFFFFF" opacity="0.025"/>
    </pattern>

    <clipPath id="lensClip">
      <circle cx="172" cy="160" r="92"/>
    </clipPath>

    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- base -->
  <rect width="900" height="320" fill="url(#bgGrad)"/>
  <rect width="900" height="320" fill="url(#hexGrid)"/>
  <rect width="900" height="320" fill="url(#scan)"/>

  <!-- outer viewfinder frame -->
  <rect x="6" y="6" width="888" height="308" rx="6" fill="none" stroke="#2DE2E6" stroke-opacity="0.18" stroke-width="1"/>

  <!-- HUD corner brackets -->
  <g stroke="#2DE2E6" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M18,42 L18,18 L42,18"/>
    <path d="M858,18 L882,18 L882,42"/>
    <path d="M18,278 L18,302 L42,302"/>
    <path d="M882,278 L882,302 L858,302"/>
  </g>
  <g stroke="#FF4FD8" stroke-width="1.4" fill="none" stroke-opacity="0.7">
    <path d="M26,26 L34,26 M26,26 L26,34"/>
    <path d="M874,26 L866,26 M874,26 L874,34"/>
  </g>

  <!-- top status strip -->
  <circle cx="40" cy="30" r="3.5" fill="#FF4FD8">
    <animate attributeName="opacity" values="1;0.15;1" dur="1.3s" repeatCount="indefinite"/>
  </circle>
  <text x="50" y="34" font-family="'Courier New',Consolas,monospace" font-size="11" letter-spacing="2" fill="#9FB4D6">REC // AR-VR MODE</text>
  <text x="860" y="34" text-anchor="end" font-family="'Courier New',Consolas,monospace" font-size="11" letter-spacing="1.5" fill="#6B7AA1">SYS://ONLINE&#160;&#160;FPS 60</text>
  <line x1="18" y1="46" x2="882" y2="46" stroke="#2DE2E6" stroke-opacity="0.15"/>

  <!-- ===== PORTAL (signature element) ===== -->
  <g>
    <!-- outer decorative rings -->
    <g>
      <circle cx="172" cy="160" r="118" fill="none" stroke="#FF4FD8" stroke-opacity="0.35" stroke-width="1" stroke-dasharray="2 10"/>
      <animateTransform attributeName="transform" type="rotate" from="0 172 160" to="360 172 160" dur="40s" repeatCount="indefinite"/>
    </g>
    <g>
      <circle cx="172" cy="160" r="105" fill="none" stroke="#9B5CFF" stroke-opacity="0.5" stroke-width="1" stroke-dasharray="5 7"/>
      <animateTransform attributeName="transform" type="rotate" from="360 172 160" to="0 172 160" dur="26s" repeatCount="indefinite"/>
    </g>

    <!-- reticle ticks -->
    <g stroke="#2DE2E6" stroke-width="1.5" opacity="0.7">
      <line x1="172" y1="38" x2="172" y2="50"/>
      <line x1="172" y1="270" x2="172" y2="282"/>
      <line x1="50" y1="160" x2="62" y2="160"/>
      <line x1="282" y1="160" x2="294" y2="160"/>
    </g>

    <!-- lens rim -->
    <circle cx="172" cy="160" r="92" fill="url(#portalBg)" stroke="#2DE2E6" stroke-width="2"/>

    <!-- inner world, clipped -->
    <g clip-path="url(#lensClip)">
      <line x1="80" y1="142" x2="264" y2="142" stroke="#2DE2E6" stroke-opacity="0.45" stroke-width="1"/>
      <g stroke="#2DE2E6" stroke-opacity="0.3" stroke-width="1">
        <line x1="172" y1="142" x2="84" y2="252"/>
        <line x1="172" y1="142" x2="106" y2="252"/>
        <line x1="172" y1="142" x2="128" y2="252"/>
        <line x1="172" y1="142" x2="150" y2="252"/>
        <line x1="172" y1="142" x2="172" y2="252"/>
        <line x1="172" y1="142" x2="194" y2="252"/>
        <line x1="172" y1="142" x2="216" y2="252"/>
        <line x1="172" y1="142" x2="238" y2="252"/>
        <line x1="172" y1="142" x2="260" y2="252"/>
      </g>
      <g fill="none" stroke="#9B5CFF" stroke-opacity="0.35" stroke-width="1">
        <path d="M112,156 Q172,172 232,156"/>
        <path d="M96,178 Q172,200 248,178"/>
        <path d="M82,206 Q172,236 262,206"/>
      </g>

      <!-- scanline sweep -->
      <rect x="80" width="184" height="3" fill="#2DE2E6" opacity="0.3">
        <animate attributeName="y" values="68;252;68" dur="3.4s" repeatCount="indefinite"/>
      </rect>

      <!-- avatar core -->
      <circle cx="172" cy="158" r="26" fill="url(#coreGlow)" opacity="0.55" filter="url(#glow)"/>
      <circle cx="172" cy="158" r="9" fill="#E9FFFF" filter="url(#glow)">
        <animate attributeName="r" values="8;11;8" dur="2.2s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- orbiting particles -->
    <g>
      <circle cx="172" cy="38" r="3" fill="#2DE2E6"/>
      <circle cx="290" cy="160" r="2.5" fill="#FF4FD8"/>
      <circle cx="172" cy="282" r="3" fill="#9B5CFF"/>
      <circle cx="54" cy="160" r="2.5" fill="#2DE2E6"/>
      <animateTransform attributeName="transform" type="rotate" from="0 172 160" to="360 172 160" dur="18s" repeatCount="indefinite"/>
    </g>

    <text x="172" y="305" text-anchor="middle" font-family="'Courier New',Consolas,monospace" font-size="10" letter-spacing="3" fill="#6B7AA1">PORTAL :: ACTIVE</text>
  </g>

  <!-- ===== TITLE BLOCK ===== -->
  <g>
    <text x="336" y="112" font-family="Arial,Helvetica,sans-serif" font-weight="800" font-size="54" letter-spacing="1" fill="url(#titleGrad)">SHOUBHIK</text>
    <text x="336" y="148" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="26" letter-spacing="7" fill="none" stroke="url(#titleGrad)" stroke-width="1">BHATTACHARYA</text>

    <rect x="336" y="162" width="64" height="3" fill="#2DE2E6"/>

    <text x="336" y="190" font-family="'Courier New',Consolas,monospace" font-size="13" letter-spacing="2" fill="#9FB4D6">GAME ARTIST  ×  TECHNICAL ARTIST</text>
    <text x="336" y="209" font-family="'Courier New',Consolas,monospace" font-size="13" letter-spacing="1.5" fill="#2DE2E6">BUILDING IMMERSIVE AR / VR WORLDS</text>

    <!-- skill chips -->
    <g font-family="'Courier New',Consolas,monospace" font-size="10.5" letter-spacing="1" font-weight="700">
      <g>
        <rect x="336" y="232" width="96" height="24" rx="12" fill="none" stroke="#2DE2E6" stroke-width="1"/>
        <text x="384" y="248" text-anchor="middle" fill="#2DE2E6">VR / AR</text>
      </g>
      <g>
        <rect x="440" y="232" width="84" height="24" rx="12" fill="none" stroke="#9B5CFF" stroke-width="1"/>
        <text x="482" y="248" text-anchor="middle" fill="#9B5CFF">UNITY</text>
      </g>
      <g>
        <rect x="532" y="232" width="92" height="24" rx="12" fill="none" stroke="#FF4FD8" stroke-width="1"/>
        <text x="578" y="248" text-anchor="middle" fill="#FF4FD8">UNREAL</text>
      </g>
      <g>
        <rect x="632" y="232" width="100" height="24" rx="12" fill="none" stroke="#2DE2E6" stroke-width="1"/>
        <text x="682" y="248" text-anchor="middle" fill="#2DE2E6">SHADERS</text>
      </g>
      <g>
        <rect x="740" y="232" width="120" height="24" rx="12" fill="none" stroke="#9B5CFF" stroke-width="1"/>
        <text x="800" y="248" text-anchor="middle" fill="#9B5CFF">REAL-TIME VFX</text>
      </g>
    </g>

    <!-- calibration bar -->
    <rect x="336" y="276" width="524" height="6" rx="3" fill="#15132A" stroke="#2DE2E6" stroke-opacity="0.25"/>
    <rect x="336" y="276" height="6" rx="3" fill="url(#barGrad)">
      <animate attributeName="width" values="0;524;0" dur="4.5s" repeatCount="indefinite"/>
    </rect>
    <text x="336" y="300" font-family="'Courier New',Consolas,monospace" font-size="10.5" letter-spacing="1.5" fill="#6B7AA1">CALIBRATING SPATIAL MESH...</text>
  </g>
</svg>
