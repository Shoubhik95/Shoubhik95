<svg viewBox="0 0 950 350" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Minecraft Style Fonts & Styles -->
    <style>
      .mc-font-bold { font-family: 'Courier New', Courier, monospace; font-weight: 900; }
      .mc-font-normal { font-family: 'Courier New', Courier, monospace; font-weight: bold; }
      .pixel-text { font-family: 'Courier New', Courier, monospace; image-rendering: pixelated; }
    </style>

    <!-- Dirt/Stone Pixel Pattern -->
    <pattern id="mcDirt" width="40" height="40" patternUnits="userSpaceOnUse">
      <!-- Dark Pixelated Dirt Texture -->
      <rect width="40" height="40" fill="#1e140d"/>
      <rect x="0" y="0" width="10" height="10" fill="#2d1e13"/>
      <rect x="20" y="10" width="10" height="10" fill="#2d1e13"/>
      <rect x="10" y="20" width="10" height="10" fill="#2d1e13"/>
      <rect x="30" y="30" width="10" height="10" fill="#2d1e13"/>
      <rect x="10" y="0" width="10" height="10" fill="#120c08"/>
      <rect x="30" y="10" width="10" height="10" fill="#120c08"/>
      <rect x="0" y="20" width="10" height="10" fill="#120c08"/>
      <rect x="20" y="30" width="10" height="10" fill="#120c08"/>
    </pattern>

    <!-- Drop Shadow for Text -->
    <filter id="mcShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="3" dy="3" stdDeviation="0" flood-color="#3f3f3f" flood-opacity="1"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background: Deep Stone/Dirt Pixel Theme -->
  <rect width="950" height="350" fill="url(#mcDirt)" stroke="#4a3b32" stroke-width="8"/>
  
  <!-- Inner Border Shadow -->
  <rect x="8" y="8" width="934" height="334" fill="none" stroke="#000000" stroke-opacity="0.4" stroke-width="4"/>

  <!-- LEFT: Isometric 3D Pixel Block (Diamond Ore / Custom block) -->
  <g transform="translate(60, 60)">
    <!-- Custom Isometric Block Drawing -->
    <!-- Top Face (Green Grass / Cyan Diamond top) -->
    <polygon points="110,10 190,50 110,90 30,50" fill="#5c8e32" stroke="#3b5c20" stroke-width="3"/>
    <polygon points="110,20 170,50 110,80 50,50" fill="#4c7828"/>
    <!-- Diamond flecks on top -->
    <rect x="95" y="40" width="12" height="12" fill="#55ffff" transform="rotate(15 95 40)"/>
    <rect x="130" y="48" width="8" height="8" fill="#55ffff"/>

    <!-- Left Face (Dirt / Stone Side) -->
    <polygon points="30,50 110,90 110,200 30,160" fill="#866043" stroke="#573d2a" stroke-width="3"/>
    <polygon points="40,65 100,95 100,185 40,155" fill="#704f35"/>
    <!-- Grass hangings -->
    <polygon points="30,50 110,90 110,115 30,75" fill="#4c7828" opacity="0.85"/>
    <polygon points="60,75 80,85 80,100 60,90" fill="#4c7828"/>

    <!-- Right Face -->
    <polygon points="110,90 190,50 190,160 110,200" fill="#737373" stroke="#525252" stroke-width="3"/>
    <!-- Diamond Ore veins on right face (representing coding/tech art) -->
    <path d="M 125 110 L 140 100 L 145 115 L 130 125 Z" fill="#55ffff" filter="url(#glow)"/>
    <path d="M 160 140 L 175 130 L 180 145 L 165 155 Z" fill="#55ffff" filter="url(#glow)"/>
    <circle cx="150" cy="120" r="3" fill="#ffffff"/>
    
    <!-- Floating Sparks/Dust -->
    <rect x="25" y="25" width="6" height="6" fill="#55ffff">
      <animate attributeName="y" values="25;10;25" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" repeatCount="indefinite"/>
    </rect>
    <rect x="185" y="30" width="8" height="8" fill="#a8ff55">
      <animate attributeName="y" values="30;15;30" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- RIGHT: Minecraft UI Panel -->
  
  <!-- Name (Minecraft Title Yellow) -->
  <text x="310" y="80" class="mc-font-bold pixel-text" font-size="42" fill="#FFFF55" filter="url(#mcShadow)" letter-spacing="1">SHOUBHIK BHATTACHARYA</text>
  
  <!-- Subtitle -->
  <text x="312" y="112" class="mc-font-normal pixel-text" font-size="16" fill="#FFAA00" filter="url(#mcShadow)" letter-spacing="2">TECHNICAL ARTIST &amp; GAME DESIGNER</text>

  <!-- Minecraft Hearts (Health Bar representing 3+ Years Experience) -->
  <g transform="translate(310, 135)">
    <!-- 10 Hearts for Full Health -->
    <!-- Heart 1 -->
    <path d="M2,2 L5,2 L5,3 L6,3 L6,2 L9,2 L9,5 L8,5 L8,6 L7,6 L7,7 L6,7 L6,8 L5,8 L5,7 L4,7 L4,6 L3,6 L3,5 L2,5 Z" fill="#FF5555" stroke="#000000" stroke-width="1"/>
    <!-- Heart 2 -->
    <path d="M14,2 L17,2 L17,3 L18,3 L18,2 L21,2 L21,5 L20,5 L20,6 L19,6 L19,7 L18,7 L18,8 L17,8 L17,7 L16,7 L16,6 L15,6 L15,5 L14,5 Z" fill="#FF5555" stroke="#000000" stroke-width="1"/>
    <!-- Heart 3 -->
    <path d="M26,2 L29,2 L29,3 L30,3 L30,2 L33,2 L33,5 L32,5 L32,6 L31,6 L31,7 L30,7 L30,8 L29,8 L29,7 L28,7 L28,6 L27,6 L27,5 L26,5 Z" fill="#FF5555" stroke="#000000" stroke-width="1"/>
    <!-- Heart 4 -->
    <path d="M38,2 L41,2 L41,3 L42,3 L42,2 L45,2 L45,5 L44,5 L44,6 L43,6 L43,7 L42,7 L42,8 L41,8 L41,7 L40,7 L40,6 L39,6 L39,5 L38,5 Z" fill="#FF5555" stroke="#000000" stroke-width="1"/>
    <!-- Heart 5 -->
    <path d="M50,2 L53,2 L53,3 L54,3 L54,2 L57,2 L57,5 L56,5 L56,6 L55,6 L55,7 L54,7 L54,8 L53,8 L53,7 L52,7 L52,6 L51,6 L51,5 L50,5 Z" fill="#FF5555" stroke="#000000" stroke-width="1"/>
    <!-- Heart 6 -->
    <path d="M62,2 L65,2 L65,3 L66,3 L66,2 L69,2 L69,5 L68,5 L68,6 L67,6 L67,7 L66,7 L66,8 L65,8 L65,7 L64,7 L64,6 L63,6 L63,5 L62,5 Z" fill="#FF5555" stroke="#000000" stroke-width="1"/>
    <!-- Heart 7 -->
    <path d="M74,2 L77,2 L77,3 L78,3 L78,2 L81,2 L81,5 L80,5 L80,6 L79,6 L79,7 L78,7 L78,8 L77,8 L77,7 L76,7 L76,6 L75,6 L75,5 L74,5 Z" fill="#FF5555" stroke="#000000" stroke-width="1"/>
    <!-- Heart 8 -->
    <path d="M86,2 L89,2 L89,3 L90,3 L90,2 L93,2 L93,5 L92,5 L92,6 L91,6 L91,7 L90,7 L90,8 L89,8 L89,7 L88,7 L88,6 L87,6 L87,5 L86,5 Z" fill="#FF5555" stroke="#000000" stroke-width="1"/>
    <!-- Heart 9 -->
    <path d="M98,2 L101,2 L101,3 L102,3 L102,2 L105,2 L105,5 L104,5 L104,6 L103,6 L103,7 L102,7 L102,8 L101,8 L101,7 L100,7 L100,6 L99,6 L99,5 L98,5 Z" fill="#FF5555" stroke="#000000" stroke-width="1"/>
    <!-- Heart 10 -->
    <path d="M110,2 L113,2 L113,3 L114,3 L114,2 L117,2 L117,5 L116,5 L116,6 L115,6 L115,7 L114,7 L114,8 L113,8 L113,7 L112,7 L112,6 L111,6 L111,5 L110,5 Z" fill="#FF5555" stroke="#000000" stroke-width="1"/>
    
    <text x="130" y="9" class="mc-font-normal pixel-text" font-size="11" fill="#FF5555" filter="url(#mcShadow)">3+ YEARS EXPERIENCE</text>
  </g>

  <!-- XP Bar (Green Minecraft bar representing active builds / project levels) -->
  <g transform="translate(310, 160)">
    <!-- Background of XP bar (dark green/black) -->
    <rect width="580" height="10" fill="#1a3300" stroke="#000000" stroke-width="1"/>
    <!-- Current XP level fill (bright green) -->
    <rect x="1" y="1" width="464" height="8" fill="#55FF55"/>
    
    <!-- XP level text centered below or above -->
    <text x="290" y="25" class="mc-font-bold pixel-text" font-size="14" fill="#55FF55" text-anchor="middle" filter="url(#mcShadow)">LVL 3 (1 BIG PROJECT &amp; 4 SMALL PROJECTS)</text>
  </g>

  <!-- Minecraft Hotbar / Inventory Slots for Skills -->
  <g transform="translate(310, 205)">
    <!-- Hotbar background (Standard gray border / light gray slots) -->
    <!-- Draw 8 inventory slots -->
    <g fill="#8f8f8f" stroke="#3c3c3c" stroke-width="3">
      <!-- Slot 1 -->
      <rect x="0" y="0" width="60" height="60" fill="#8f8f8f" rx="3"/>
      <!-- Slot 2 -->
      <rect x="70" y="0" width="60" height="60" fill="#8f8f8f" rx="3"/>
      <!-- Slot 3 -->
      <rect x="140" y="0" width="60" height="60" fill="#8f8f8f" rx="3"/>
      <!-- Slot 4 -->
      <rect x="210" y="0" width="60" height="60" fill="#8f8f8f" rx="3"/>
      <!-- Slot 5 -->
      <rect x="280" y="0" width="60" height="60" fill="#8f8f8f" rx="3"/>
      <!-- Slot 6 -->
      <rect x="350" y="0" width="60" height="60" fill="#8f8f8f" rx="3"/>
      <!-- Slot 7 -->
      <rect x="420" y="0" width="60" height="60" fill="#8f8f8f" rx="3"/>
      <!-- Slot 8 -->
      <rect x="490" y="0" width="60" height="60" fill="#8f8f8f" rx="3"/>
    </g>

    <!-- Slot details / Inner dark bevels and skill labels -->
    <!-- Slot 1: Python -->
    <rect x="5" y="5" width="50" height="50" fill="#5c5c5c"/>
    <text x="30" y="32" class="mc-font-bold pixel-text" font-size="11" fill="#FFFF55" text-anchor="middle" filter="url(#mcShadow)">PY</text>
    
    <!-- Slot 2: C++ -->
    <rect x="75" y="5" width="50" height="50" fill="#5c5c5c"/>
    <text x="100" y="32" class="mc-font-bold pixel-text" font-size="11" fill="#FFFF55" text-anchor="middle" filter="url(#mcShadow)">C++</text>
    
    <!-- Slot 3: C# -->
    <rect x="145" y="5" width="50" height="50" fill="#5c5c5c"/>
    <text x="170" y="32" class="mc-font-bold pixel-text" font-size="11" fill="#FFFF55" text-anchor="middle" filter="url(#mcShadow)">C#</text>
    
    <!-- Slot 4: Unreal -->
    <rect x="215" y="5" width="50" height="50" fill="#5c5c5c"/>
    <text x="240" y="32" class="mc-font-bold pixel-text" font-size="11" fill="#FF5555" text-anchor="middle" filter="url(#mcShadow)">UE5</text>
    
    <!-- Slot 5: Unity -->
    <rect x="285" y="5" width="50" height="50" fill="#5c5c5c"/>
    <text x="310" y="32" class="mc-font-bold pixel-text" font-size="11" fill="#55FFFF" text-anchor="middle" filter="url(#mcShadow)">UNITY</text>
    
    <!-- Slot 6: Blender -->
    <rect x="355" y="5" width="50" height="50" fill="#5c5c5c"/>
    <text x="380" y="32" class="mc-font-bold pixel-text" font-size="10" fill="#FFAA00" text-anchor="middle" filter="url(#mcShadow)">BLEND</text>
    
    <!-- Slot 7: Figma -->
    <rect x="425" y="5" width="50" height="50" fill="#5c5c5c"/>
    <text x="450" y="32" class="mc-font-bold pixel-text" font-size="11" fill="#FF55FF" text-anchor="middle" filter="url(#mcShadow)">FIGMA</text>
    
    <!-- Slot 8: Web -->
    <rect x="495" y="5" width="50" height="50" fill="#5c5c5c"/>
    <text x="520" y="32" class="mc-font-bold pixel-text" font-size="11" fill="#55FF55" text-anchor="middle" filter="url(#mcShadow)">HTML</text>
  </g>

  <!-- Bottom stats bar description -->
  <text x="310" y="295" class="mc-font-normal pixel-text" font-size="11" fill="#AAAAAA" filter="url(#mcShadow)">INVENTORY SELECT // PRESS [1-8] TO SWAP TOOL</text>
</svg>
