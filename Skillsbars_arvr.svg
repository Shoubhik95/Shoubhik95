<g font-family="'Courier New',Consolas,monospace" font-size="12">

  <!-- Unreal Engine -->
  <text x="28" y="64" fill="#E7ECFF">Unreal Engine 5</text>
  <rect x="280" y="55" width="240" height="10" rx="5" fill="#15132A" stroke="#2DE2E6" stroke-opacity="0.2"/>
  <rect x="280" y="55" width="168" height="10" rx="5" fill="url(#sBar2)">
    <animate attributeName="width" values="0;168;168" dur="1.4s" fill="freeze"/>
  </rect>
  <text x="528" y="64" text-anchor="end" fill="#FF4FD8">70%</text>

  <!-- Unity -->
  <text x="28" y="96" fill="#E7ECFF">Unity (C#)</text>
  <rect x="280" y="87" width="240" height="10" rx="5" fill="#15132A" stroke="#9B5CFF" stroke-opacity="0.2"/>
  <rect x="280" y="87" width="156" height="10" rx="5" fill="url(#sBar1)">
    <animate attributeName="width" values="0;156;156" dur="1.4s" fill="freeze"/>
  </rect>
  <text x="528" y="96" text-anchor="end" fill="#9B5CFF">65%</text>

  <!-- Environment -->
  <text x="28" y="128" fill="#E7ECFF">Environment Design</text>
  <rect x="280" y="119" width="240" height="10" rx="5" fill="#15132A" stroke="#2DE2E6" stroke-opacity="0.2"/>
  <rect x="280" y="119" width="180" height="10" rx="5" fill="url(#sBar1)">
    <animate attributeName="width" values="0;180;180" dur="1.4s" fill="freeze"/>
  </rect>
  <text x="528" y="128" text-anchor="end" fill="#2DE2E6">75%</text>

  <!-- Blender -->
  <text x="28" y="160" fill="#E7ECFF">Blender (3D)</text>
  <rect x="280" y="151" width="240" height="10" rx="5" fill="#15132A" stroke="#9B5CFF" stroke-opacity="0.2"/>
  <rect x="280" y="151" width="144" height="10" rx="5" fill="url(#sBar2)">
    <animate attributeName="width" values="0;144;144" dur="1.4s" fill="freeze"/>
  </rect>
  <text x="528" y="160" text-anchor="end" fill="#FF4FD8">60%</text>

  <!-- C++ -->
  <text x="28" y="192" fill="#E7ECFF">C++ Programming</text>
  <rect x="280" y="183" width="240" height="10" rx="5" fill="#15132A" stroke="#2DE2E6" stroke-opacity="0.2"/>
  <rect x="280" y="183" width="163" height="10" rx="5" fill="url(#sBar1)">
    <animate attributeName="width" values="0;163;163" dur="1.4s" fill="freeze"/>
  </rect>
  <text x="528" y="192" text-anchor="end" fill="#2DE2E6">68%</text>

  <!-- HTML/CSS/JS -->
  <text x="28" y="224" fill="#E7ECFF">HTML • CSS • JavaScript</text>
  <rect x="280" y="215" width="240" height="10" rx="5" fill="#15132A" stroke="#9B5CFF" stroke-opacity="0.2"/>
  <rect x="280" y="215" width="156" height="10" rx="5" fill="url(#sBar2)">
    <animate attributeName="width" values="0;156;156" dur="1.4s" fill="freeze"/>
  </rect>
  <text x="528" y="224" text-anchor="end" fill="#9B5CFF">65%</text>

</g>
