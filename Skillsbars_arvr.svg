<svg viewBox="0 0 560 268" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06060F"/>
      <stop offset="100%" stop-color="#120B2E"/>
    </linearGradient>
    <linearGradient id="sBar1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2DE2E6"/>
      <stop offset="100%" stop-color="#9B5CFF"/>
    </linearGradient>
    <linearGradient id="sBar2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9B5CFF"/>
      <stop offset="100%" stop-color="#FF4FD8"/>
    </linearGradient>
    <pattern id="sHex" width="28" height="24" patternUnits="userSpaceOnUse">
      <path d="M14 0 L28 7 L28 17 L14 24 L0 17 L0 7 Z" fill="none" stroke="#2DE2E6" stroke-opacity="0.06"/>
    </pattern>
  </defs>

  <rect width="560" height="268" rx="10" fill="url(#sBg)"/>
  <rect width="560" height="268" rx="10" fill="url(#sHex)"/>
  <rect x="4" y="4" width="552" height="260" rx="8" fill="none" stroke="#2DE2E6" stroke-opacity="0.18"/>

  <g stroke="#2DE2E6" stroke-width="1.6" fill="none" stroke-linecap="round">
    <path d="M14,26 L14,12 L28,12"/>
    <path d="M532,12 L546,12 L546,26"/>
    <path d="M14,242 L14,256 L28,256"/>
    <path d="M546,242 L546,256 L532,256"/>
  </g>

  <text x="28" y="34" font-family="'Courier New',Consolas,monospace" font-size="12" letter-spacing="3" fill="#9FB4D6">// SKILL MATRIX</text>
  <line x1="28" y1="42" x2="532" y2="42" stroke="#2DE2E6" stroke-opacity="0.18"/>

  <g font-family="'Courier New',Consolas,monospace" font-size="12">
    <!-- row 1 -->
    <text x="28" y="64" fill="#E7ECFF">Shaders &amp; VFX</text>
    <rect x="280" y="55" width="240" height="10" rx="5" fill="#15132A" stroke="#2DE2E6" stroke-opacity="0.2"/>
    <rect x="280" y="55" height="10" rx="5" fill="url(#sBar1)">
      <animate attributeName="width" values="0;228;228" dur="1.4s" fill="freeze"/>
    </rect>
    <text x="528" y="64" text-anchor="end" fill="#2DE2E6">55%</text>

    <!-- row 2 -->
    <text x="28" y="96" fill="#E7ECFF">Real-Time Rendering</text>
    <rect x="280" y="87" width="240" height="10" rx="5" fill="#15132A" stroke="#2DE2E6" stroke-opacity="0.2"/>
    <rect x="280" y="87" height="10" rx="5" fill="url(#sBar1)">
      <animate attributeName="width" values="0;216;216" dur="1.4s" fill="freeze"/>
    </rect>
    <text x="528" y="96" text-anchor="end" fill="#2DE2E6">90%</text>

    <!-- row 3 -->
    <text x="28" y="128" fill="#E7ECFF">Unity (C#)</text>
    <rect x="280" y="119" width="240" height="10" rx="5" fill="#15132A" stroke="#9B5CFF" stroke-opacity="0.2"/>
    <rect x="280" y="119" height="10" rx="5" fill="url(#sBar1)">
      <animate attributeName="width" values="0;211;211" dur="1.4s" fill="freeze"/>
    </rect>
    <text x="528" y="128" text-anchor="end" fill="#9B5CFF">88%</text>

    <!-- row 4 -->
    <text x="28" y="160" fill="#E7ECFF">Unreal Engine</text>
    <rect x="280" y="151" width="240" height="10" rx="5" fill="#15132A" stroke="#9B5CFF" stroke-opacity="0.2"/>
    <rect x="280" y="151" height="10" rx="5" fill="url(#sBar2)">
      <animate attributeName="width" values="0;192;192" dur="1.4s" fill="freeze"/>
    </rect>
    <text x="528" y="160" text-anchor="end" fill="#FF4FD8">80%</text>

    <!-- row 5 -->
    <text x="28" y="192" fill="#E7ECFF">Tech Art Pipelines</text>
    <rect x="280" y="183" width="240" height="10" rx="5" fill="#15132A" stroke="#2DE2E6" stroke-opacity="0.2"/>
    <rect x="280" y="183" height="10" rx="5" fill="url(#sBar1)">
      <animate attributeName="width" values="0;204;204" dur="1.4s" fill="freeze"/>
    </rect>
    <text x="528" y="192" text-anchor="end" fill="#2DE2E6">85%</text>

    <!-- row 6 -->
    <text x="28" y="224" fill="#E7ECFF">3D Tools (Blender/Maya)</text>
    <rect x="280" y="215" width="240" height="10" rx="5" fill="#15132A" stroke="#9B5CFF" stroke-opacity="0.2"/>
    <rect x="280" y="215" height="10" rx="5" fill="url(#sBar2)">
      <animate attributeName="width" values="0;187;187" dur="1.4s" fill="freeze"/>
    </rect>
    <text x="528" y="224" text-anchor="end" fill="#9B5CFF">78%</text>
  </g>
</svg>
